name: 'CI Scripts and Quality Gate Verification'

on:
  push:
    paths:
      - 'scripts/**'
      - '.github/scripts/**'
      - 'pytest.ini'
      - '.github/pytest.ini'
      - '.github/workflows/ci-scripts.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - '.github/scripts/**'
      - 'pytest.ini'
      - '.github/pytest.ini'
      - '.github/workflows/ci-scripts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-scripts:
    name: 'Pytest Suite - Python ${{ matrix.python-version }}'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f "scripts/requirements-test.txt" ]; then
            pip install -r scripts/requirements-test.txt
          elif [ -f ".github/scripts/requirements-test.txt" ]; then
            pip install -r .github/scripts/requirements-test.txt
          else
            pip install pytest
          fi

      - name: Execute Pytest Suite for Harvest Window Gatekeeper
        shell: bash
        run: |
          if [ -f "pytest.ini" ]; then
            python -m pytest
          elif [ -f ".github/pytest.ini" ]; then
            python -m pytest -c .github/pytest.ini .github/scripts/
          else
            python -m pytest
          fi

  audit-zero-emojis:
    name: 'Audit Zero-Emoji Mandate'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Scan repository for emoji violations
        shell: bash
        run: |
          python - << 'EOF'
          import os
          import sys
          import unicodedata

          def contains_emoji(text: str) -> bool:
              for ch in text:
                  cp = ord(ch)
                  cat = unicodedata.category(ch)
                  if cp > 127 and (
                      cat in ("So", "Sk")
                      or (0x1F300 <= cp <= 0x1FAFF)
                      or (0x2600 <= cp <= 0x27BF)
                      or (0xFE00 <= cp <= 0xFE0F)
                  ):
                      return True
              return False

          violations = []
          for root, dirs, files in os.walk("."):
              if ".git" in dirs:
                  dirs.remove(".git")
              if ".pytest_cache" in dirs:
                  dirs.remove(".pytest_cache")
              if "__pycache__" in dirs:
                  dirs.remove("__pycache__")
              for f in files:
                  if f.endswith((".pyc", ".png", ".jpg", ".jpeg", ".ico", ".bin")):
                      continue
                  path = os.path.join(root, f)
                  try:
                      with open(path, "r", encoding="utf-8") as fp:
                          for line_no, line in enumerate(fp, 1):
                              if contains_emoji(line):
                                  violations.append(f"{path}:{line_no}: {line.strip()[:80]}")
                  except (UnicodeDecodeError, OSError):
                      continue

          if violations:
              print(f"FAILED: Found {len(violations)} lines containing forbidden emoji characters:")
              for v in violations:
                  print(f"  {v}")
              sys.exit(1)
          else:
              print("SUCCESS: Zero emojis found across all files. Strict compliance verified.")
          EOF

