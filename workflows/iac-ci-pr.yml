name: 'IaC Continuous Integration (PR)'

on:
  pull_request:
    branches:
      - main
    paths:
      - 'iac/**'
      - '.github/workflows/iac-ci-pr.yml'
      - '.github/actions/setup-iac-tools/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  pull-requests: write

concurrency:
  group: iac-ci-pr-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  quality-and-security:
    name: 'Static Quality and Security Analysis'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup IaC Tools (Terraform, TFLint, Trivy)
        uses: ./.github/actions/setup-iac-tools
        with:
          terraform-version: '1.10.5'
          tflint-version: 'v0.55.0'
          trivy-version: 'v0.58.2'
          tflint-config-path: 'iac/.tflint.hcl'

      - name: Check Terraform formatting
        shell: bash
        run: |
          echo "[INFO] Running terraform fmt check..."
          terraform fmt -check -recursive iac/

      - name: Validate Terraform configuration per environment
        shell: bash
        run: |
          set -e
          TARGET_DIRS=("iac/bootstrap" "iac/environments/dev" "iac/environments/test" "iac/environments/prod")
          for dir in "${TARGET_DIRS[@]}"; do
            if [ -d "$dir" ]; then
              echo "[INFO] Validating syntax in $dir..."
              (cd "$dir" && terraform init -backend=false && terraform validate)
            fi
          done

      - name: Run TFLint recursive inspection
        shell: bash
        run: |
          echo "[INFO] Running TFLint inspection..."
          tflint --recursive --config=iac/.tflint.hcl

      - name: Run Trivy security and misconfiguration scan
        shell: bash
        run: |
          echo "[INFO] Scanning IaC configurations with Trivy..."
          trivy config \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --scanners misconfig \
            iac/

  speculative-plan:
    name: 'Speculative Plan - ${{ matrix.environment }}'
    needs: quality-and-security
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, test, prod]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform CLI
        uses: ./.github/actions/setup-iac-tools
        with:
          terraform-version: '1.10.5'
          install-tflint: 'false'
          install-trivy: 'false'

      - name: Resolve OIDC Role ARN for Environment
        id: resolve-role
        shell: bash
        env:
          ROLE_DEV: ${{ vars.AWS_ROLE_ARN_DEV || secrets.AWS_ROLE_ARN_DEV }}
          ROLE_TEST: ${{ vars.AWS_ROLE_ARN_TEST || secrets.AWS_ROLE_ARN_TEST }}
          ROLE_PROD: ${{ vars.AWS_ROLE_ARN_PROD || secrets.AWS_ROLE_ARN_PROD }}
        run: |
          ENV_NAME="${{ matrix.environment }}"
          case "$ENV_NAME" in
            dev)
              ROLE="${ROLE_DEV:-arn:aws:iam::111111111111:role/aromapacifico-ci-dev}"
              ;;
            test)
              ROLE="${ROLE_TEST:-arn:aws:iam::222222222222:role/aromapacifico-ci-test}"
              ;;
            prod)
              ROLE="${ROLE_PROD:-arn:aws:iam::333333333333:role/aromapacifico-ci-prod}"
              ;;
            *)
              ROLE=""
              ;;
          esac
          echo "role_arn=${ROLE}" >> $GITHUB_OUTPUT

      - name: Authenticate to AWS via OIDC (No Static Credentials)
        id: aws-auth
        uses: aws-actions/configure-aws-credentials@v4
        continue-on-error: true
        with:
          role-to-assume: ${{ steps.resolve-role.outputs.role_arn }}
          aws-region: us-east-1
          audience: sts.amazonaws.com

      - name: Execute Terraform Speculative Plan
        id: tf-plan
        shell: bash
        run: |
          set -e
          cd "iac/environments/${{ matrix.environment }}"
          
          if [ "${{ steps.aws-auth.outcome }}" == "success" ]; then
            echo "[INFO] Running terraform init with remote S3 backend..."
            terraform init -backend-config=backend.hcl
            echo "[INFO] Generating speculative terraform plan..."
            terraform plan -no-color -lock=false -out=tfplan
            terraform show -no-color tfplan > plan_output.txt
          else
            echo "[WARN] OIDC authentication not completed in this runner. Performing static initialization."
            terraform init -backend=false
            echo "Static syntax validation completed. Remote state inspection requires live AWS OIDC role credentials." > plan_output.txt
          fi

      - name: Post Plan Summary to Pull Request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = `iac/environments/${{ matrix.environment }}/plan_output.txt`;
            let planText = 'Plan output not captured.';
            if (fs.existsSync(path)) {
              planText = fs.readFileSync(path, 'utf8');
              if (planText.length > 60000) {
                planText = planText.substring(0, 60000) + '\n... [Plan output truncated due to GitHub comment size limits]';
              }
            }

            const header = `### Terraform Speculative Plan: \`${{ matrix.environment }}\``;
            const body = `${header}
            
| Parameter | Value |
| --- | --- |
| Environment | \`${{ matrix.environment }}\` |
| Working Directory | \`iac/environments/${{ matrix.environment }}\` |
| Trigger Commit | \`${context.sha.substring(0, 7)}\` |
| Auth Method | AWS OIDC (${{ steps.aws-auth.outcome }}) |

<details>
<summary>View Terraform Plan Output</summary>

\`\`\`hcl
${planText}
\`\`\`

</details>
`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' && comment.body.includes(header)
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }
