name: 'IaC Continuous Integration (Reusable Pipeline)'

on:
  workflow_call:
    inputs:
      terraform-version:
        description: 'Version of Terraform CLI to install.'
        required: false
        type: string
        default: '1.15.8'
      tflint-version:
        description: 'Version of TFLint CLI to install.'
        required: false
        type: string
        default: 'v0.55.0'
      trivy-version:
        description: 'Version of Trivy scanner to install.'
        required: false
        type: string
        default: 'v0.76.1'
    secrets:
      INFRACOST_API_KEY:
        required: false
      AWS_ROLE_ARN_DEV:
        required: false
      AWS_ROLE_ARN_TEST:
        required: false
      AWS_ROLE_ARN_PROD:
        required: false

permissions:
  id-token: write
  contents: read
  pull-requests: write
  issues: write

jobs:
  detect-changes:
    name: 'Detect Changed Modules and Environments'
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.detect.outputs.modules }}
      has_modules: ${{ steps.detect.outputs.has_modules }}
      environments: ${{ steps.detect.outputs.environments }}
      has_environments: ${{ steps.detect.outputs.has_environments }}
      all_triggered: ${{ steps.detect.outputs.all_triggered }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Detect Changed Targets
        id: detect
        shell: bash
        run: |
          BASE_REF="origin/${{ github.base_ref || 'main' }}"
          echo "[INFO] Comparing changes against base ref: $BASE_REF"
          if [ -f ".github/scripts/detect_changed_targets.py" ]; then
            python .github/scripts/detect_changed_targets.py --base-ref "$BASE_REF" || python .github/scripts/detect_changed_targets.py --force-all
          elif [ -f "scripts/detect_changed_targets.py" ]; then
            python scripts/detect_changed_targets.py --base-ref "$BASE_REF" || python scripts/detect_changed_targets.py --force-all
          else
            echo "modules=[]" >> $GITHUB_OUTPUT
            echo "has_modules=false" >> $GITHUB_OUTPUT
            echo "environments=[\"dev\",\"test\",\"prod\"]" >> $GITHUB_OUTPUT
            echo "has_environments=true" >> $GITHUB_OUTPUT
            echo "all_triggered=true" >> $GITHUB_OUTPUT
          fi

  validate-modules:
    name: 'Validate Module (${{ matrix.module }})'
    needs: detect-changes
    if: needs.detect-changes.outputs.has_modules == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.detect-changes.outputs.modules) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Governance: Central action invocation from aromapacifico-platform/.github
      - name: Setup IaC Tools via Central .github Composite Action
        uses: aromapacifico-platform/.github/actions/setup-iac-tools@v1.0.0
        with:
          terraform-version: ${{ inputs.terraform-version }}
          tflint-version: ${{ inputs.tflint-version }}
          trivy-version: ${{ inputs.trivy-version }}
          install-infracost: 'false'
          tflint-config-path: '.tflint.hcl'

      - name: Check Terraform formatting for module
        working-directory: ${{ matrix.module }}
        shell: bash
        run: |
          echo "[INFO] Checking terraform fmt in ${{ matrix.module }}..."
          terraform fmt -check -recursive .

      - name: Validate module syntax
        working-directory: ${{ matrix.module }}
        shell: bash
        run: |
          echo "[INFO] Validating module syntax in ${{ matrix.module }}..."
          terraform init -backend=false
          # A module that only receives aliased providers (configuration_aliases)
          # cannot be validated on its own; its sample fixture validates it below.
          if grep -rqs "configuration_aliases" --include="*.tf" . && [ -d "sample" ]; then
            echo "[INFO] Module uses configuration_aliases; validation runs through sample/."
          else
            terraform validate
          fi

      - name: Run TFLint on module
        working-directory: ${{ matrix.module }}
        shell: bash
        run: |
          echo "[INFO] Running TFLint on ${{ matrix.module }}..."
          CONFIG_PATH="$GITHUB_WORKSPACE/.tflint.hcl"
          if [ -f "$CONFIG_PATH" ]; then
            tflint --recursive --config="$CONFIG_PATH"
          else
            tflint --recursive
          fi

      - name: Run Trivy security scan on module
        working-directory: ${{ matrix.module }}
        shell: bash
        run: |
          echo "[INFO] Scanning module ${{ matrix.module }} with Trivy..."
          trivy config --severity HIGH,CRITICAL --exit-code 1 .

      - name: Validate sample execution fixture (PC-IAC-026)
        working-directory: ${{ matrix.module }}
        shell: bash
        run: |
          if [ -d "sample" ]; then
            echo "[INFO] Validating sample fixture in ${{ matrix.module }}/sample per PC-IAC-026..."
            cd sample
            terraform fmt -check -recursive .
            terraform init -backend=false
            terraform validate
          else
            echo "[INFO] No sample directory present in ${{ matrix.module }}."
          fi

  validate-environments:
    name: 'Validate Environment (${{ matrix.environment }})'
    needs: detect-changes
    if: needs.detect-changes.outputs.has_environments == 'true' || needs.detect-changes.outputs.all_triggered == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, test, prod]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform CLI via Central .github Composite Action
        uses: aromapacifico-platform/.github/actions/setup-iac-tools@v1.0.0
        with:
          terraform-version: ${{ inputs.terraform-version }}
          install-tflint: 'false'
          install-trivy: 'false'
          install-infracost: 'false'

      - name: Validate environment syntax
        shell: bash
        run: |
          TARGET="environments/${{ matrix.environment }}"
          if [ ! -d "$TARGET" ] && [ -d "iac/environments/${{ matrix.environment }}" ]; then
            TARGET="iac/environments/${{ matrix.environment }}"
          fi
          if [ -d "$TARGET" ]; then
            echo "[INFO] Validating syntax in $TARGET..."
            cd "$TARGET"
            terraform fmt -check -recursive .
            terraform init -backend=false
            terraform validate
          fi

  infracost-finops:
    name: 'FinOps Cloud Cost Estimation'
    needs: [detect-changes]
    if: github.event_name == 'pull_request' && (needs.detect-changes.outputs.has_modules == 'true' || needs.detect-changes.outputs.has_environments == 'true')
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Infracost CLI
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Generate Infracost Baseline and Diff
        id: infracost-diff
        shell: bash
        continue-on-error: true
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
        run: |
          CONFIG_FILE="infracost.yml"
          if [ ! -f "$CONFIG_FILE" ] && [ -f ".github/infracost.yml" ]; then
            CONFIG_FILE=".github/infracost.yml"
          fi

          if [ -z "$INFRACOST_API_KEY" ]; then
            echo "[WARN] INFRACOST_API_KEY is not configured in repository secrets."
            echo "[WARN] Skipping FinOps cost diff comment. Please add INFRACOST_API_KEY secret to enable cost estimation."
            echo "skipped=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ ! -f "$CONFIG_FILE" ]; then
            echo "[WARN] Infracost configuration file '$CONFIG_FILE' not found. Skipping cost estimation."
            echo "skipped=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "[INFO] Generating baseline cost from base branch using $CONFIG_FILE..."
          git checkout "${{ github.event.pull_request.base.ref || 'main' }}"
          if [ -f "$CONFIG_FILE" ]; then
            infracost breakdown --config-file="$CONFIG_FILE" --format=json --out-file=/tmp/infracost-base.json || true
          fi

          echo "[INFO] Generating cost diff for pull request branch..."
          git checkout "${{ github.event.pull_request.head.sha || github.sha }}"

          if [ -f /tmp/infracost-base.json ] && [ -s /tmp/infracost-base.json ]; then
            infracost diff --config-file="$CONFIG_FILE" \
              --format=json \
              --compare-to=/tmp/infracost-base.json \
              --out-file=/tmp/infracost.json || true
          else
            echo "[INFO] Baseline not available or empty; generating initial breakdown for PR branch..."
            infracost breakdown --config-file="$CONFIG_FILE" \
              --format=json \
              --out-file=/tmp/infracost.json || true
          fi

          if [ -s /tmp/infracost.json ]; then
            echo "skipped=false" >> $GITHUB_OUTPUT
          else
            echo "[WARN] Could not produce Infracost JSON diff/breakdown. Skipping comment."
            echo "skipped=true" >> $GITHUB_OUTPUT
          fi

      - name: Post Infracost Comment to Pull Request
        if: github.event_name == 'pull_request' && steps.infracost-diff.outputs.skipped != 'true'
        shell: bash
        continue-on-error: true
        run: |
          if [ -f /tmp/infracost.json ] && [ -s /tmp/infracost.json ]; then
            echo "[INFO] Publishing Infracost cost estimation comment to Pull Request..."
            infracost comment github \
              --path=/tmp/infracost.json \
              --repo=${{ github.repository }} \
              --github-token=${{ secrets.GITHUB_TOKEN }} \
              --pull-request=${{ github.event.pull_request.number }} \
              --behavior=update || true
          fi

  speculative-plan:
    name: 'Speculative Plan - ${{ matrix.environment }}'
    needs: [detect-changes, validate-environments]
    if: always() && (needs.detect-changes.outputs.has_environments == 'true' || needs.detect-changes.outputs.all_triggered == 'true')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, test, prod]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform CLI via Central .github Composite Action
        uses: aromapacifico-platform/.github/actions/setup-iac-tools@v1.0.0
        with:
          terraform-version: ${{ inputs.terraform-version }}
          install-tflint: 'false'
          install-trivy: 'false'
          install-infracost: 'false'

      - name: Resolve OIDC Role ARN for Environment
        id: resolve-role
        shell: bash
        env:
          ROLE_DEV: ${{ vars.AWS_ROLE_ARN_DEV || secrets.AWS_ROLE_ARN_DEV }}
          ROLE_TEST: ${{ vars.AWS_ROLE_ARN_TEST || secrets.AWS_ROLE_ARN_TEST }}
          ROLE_PROD: ${{ vars.AWS_ROLE_ARN_PROD || secrets.AWS_ROLE_ARN_PROD }}
        run: |
          ENV_NAME="${{ matrix.environment }}"
          case "$ENV_NAME" in
            dev)
              ROLE="${ROLE_DEV:-}"
              ;;
            test)
              ROLE="${ROLE_TEST:-}"
              ;;
            prod)
              ROLE="${ROLE_PROD:-}"
              ;;
            *)
              ROLE=""
              ;;
          esac
          echo "role_arn=${ROLE}" >> $GITHUB_OUTPUT

      - name: Inspect OIDC Token Claims (Diagnostic)
        shell: bash
        run: |
          echo "[INFO] Inspecting GitHub Actions OIDC JWT claims..."
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
            TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r '.value // empty')
            if [ -n "$TOKEN" ]; then
              PAYLOAD=$(echo "$TOKEN" | cut -d'.' -f2)
              REM=$(( ${#PAYLOAD} % 4 ))
              if [ $REM -eq 2 ]; then PAYLOAD="${PAYLOAD}=="; elif [ $REM -eq 3 ]; then PAYLOAD="${PAYLOAD}="; fi
              echo "[INFO] Decoded OIDC JWT Claims for AWS STS:"
              echo "$PAYLOAD" | base64 -d 2>/dev/null | jq '{iss: .iss, aud: .aud, sub: .sub, repository: .repository, ref: .ref, event_name: .event_name}' || true
            else
              echo "[WARN] Could not retrieve OIDC token from GitHub token endpoint."
            fi
          else
            echo "[WARN] OIDC request environment variables not present."
          fi

      - name: Authenticate to AWS via OIDC (No Static Credentials)
        id: aws-auth
        if: steps.resolve-role.outputs.role_arn != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.resolve-role.outputs.role_arn }}
          aws-region: us-east-1
          audience: sts.amazonaws.com

      - name: Execute Terraform Speculative Plan
        id: tf-plan
        shell: bash
        run: |
          TARGET_DIR="environments/${{ matrix.environment }}"
          if [ ! -d "$TARGET_DIR" ]; then
            echo "::error::Environment directory $TARGET_DIR not found."
            exit 1
          fi
          if [ "${{ steps.aws-auth.outcome }}" != "success" ]; then
            echo "::error::No OIDC role configured for ${{ matrix.environment }}; a plan needs AWS credentials."
            exit 1
          fi
          cd "$TARGET_DIR"
          echo "[INFO] Initializing Terraform backend for ${{ matrix.environment }} against remote S3 state..."
          terraform init -input=false -backend-config=backend.hcl
          echo "[INFO] Running speculative plan for ${{ matrix.environment }}..."
          terraform plan -input=false -no-color -lock=false -out=tfplan
          terraform show -no-color tfplan > plan_output.txt

      - name: Upload plan output
        uses: actions/upload-artifact@v4
        with:
          name: plan-${{ matrix.environment }}
          path: environments/${{ matrix.environment }}/plan_output.txt
          retention-days: 30

      - name: Post Plan Summary to Pull Request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let path = `environments/${{ matrix.environment }}/plan_output.txt`;
            if (!fs.existsSync(path)) {
              path = `iac/environments/${{ matrix.environment }}/plan_output.txt`;
            }
            if (!fs.existsSync(path)) {
              return;
            }
            let planText = fs.readFileSync(path, 'utf8');
            if (planText.length > 60000) {
              planText = planText.substring(0, 60000) + '\n... [Plan output truncated due to GitHub comment size limits]';
            }

            const header = `### Terraform Speculative Plan: \`${{ matrix.environment }}\``;
            const body = [
              header,
              "",
              "| Parameter | Value |",
              "| --- | --- |",
              `| Environment | \`${{ matrix.environment }}\` |`,
              `| Working Directory | \`environments/${{ matrix.environment }}\` |`,
              `| Trigger Commit | \`${context.sha.substring(0, 7)}\` |`,
              `| Auth Method | AWS OIDC (${{ steps.aws-auth.outcome || 'static-mode' }}) |`,
              "",
              "<details>",
              "<summary>View Terraform Plan Output</summary>",
              "",
              "```hcl",
              planText,
              "```",
              "",
              "</details>"
            ].join("\n");

            try {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });

              const botComment = comments.find(comment =>
                comment.user.type === 'Bot' && comment.body.includes(header)
              );

              if (botComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: botComment.id,
                  body: body
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: body
                });
              }
            } catch (err) {
              core.warning(`[WARN] Could not post PR comment: ${err.message}`);
            }

