name: 'Reusable Terraform Pipeline'

on:
  workflow_call:
    inputs:
      environment:
        description: 'Target environment name (dev, test, prod).'
        required: true
        type: string
      execution_mode:
        description: 'Execution mode: plan, apply, or plan-and-apply.'
        required: false
        type: string
        default: 'plan-and-apply'
      working_directory:
        description: 'Path to working directory containing Terraform configuration.'
        required: false
        type: string
        default: ''
      aws_role_arn:
        description: 'AWS IAM Role ARN assumed via GitHub Actions OIDC.'
        required: true
        type: string
      aws_region:
        description: 'AWS target region.'
        required: false
        type: string
        default: 'us-east-1'
      terraform_version:
        description: 'Version of Terraform CLI.'
        required: false
        type: string
        default: '1.15.8'
      apply_changes:
        description: 'Whether to execute the apply stage (default true in plan-and-apply mode).'
        required: false
        type: boolean
        default: true
      artifact_name:
        description: 'Name of the immutable plan artifact.'
        required: false
        type: string
        default: ''
      artifact_retention_days:
        description: 'Retention period in days for the plan artifact.'
        required: false
        type: number
        default: 2

permissions:
  id-token: write
  contents: read

jobs:
  plan:
    name: 'Plan - ${{ inputs.environment }}'
    if: inputs.execution_mode == 'plan-and-apply' || inputs.execution_mode == 'plan'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Environment Working Directory
        id: target-dir
        shell: bash
        run: |
          TARGET="${{ inputs.working_directory }}"
          if [ -z "$TARGET" ] || [ ! -d "$TARGET" ]; then
            if [ -d "iac/environments/${{ inputs.environment }}" ]; then
              TARGET="iac/environments/${{ inputs.environment }}"
            elif [ -d "environments/${{ inputs.environment }}" ]; then
              TARGET="environments/${{ inputs.environment }}"
            fi
          fi
          echo "[INFO] Resolved target working directory: $TARGET"
          echo "path=${TARGET}" >> $GITHUB_OUTPUT

      - name: Setup Terraform CLI
        uses: aromapacifico-platform/.github/actions/setup-iac-tools@v1.0.0
        with:
          terraform-version: ${{ inputs.terraform_version }}
          install-tflint: 'false'
          install-trivy: 'false'
          install-infracost: 'false'

      - name: Authenticate to AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.aws_role_arn }}
          aws-region: ${{ inputs.aws_region }}
          audience: sts.amazonaws.com

      - name: Terraform Init
        working-directory: ${{ steps.target-dir.outputs.path }}
        shell: bash
        run: |
          echo "[INFO] Initializing Terraform for environment: ${{ inputs.environment }}"
          terraform init -backend-config=backend.hcl

      - name: Generate Speculative Binary and Text Plan
        id: generate-plan
        working-directory: ${{ steps.target-dir.outputs.path }}
        shell: bash
        run: |
          echo "[INFO] Generating binary terraform plan (tfplan)..."
          terraform plan -no-color -out=tfplan
          echo "[INFO] Emitting plain text plan output (tfplan.txt) for audit..."
          terraform show -no-color tfplan > tfplan.txt

      - name: Upload Immutable Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name != '' && inputs.artifact_name || format('tfplan-{0}', inputs.environment) }}
          path: |
            ${{ steps.target-dir.outputs.path }}/tfplan
            ${{ steps.target-dir.outputs.path }}/tfplan.txt
          retention-days: ${{ inputs.artifact_retention_days }}
          if-no-files-found: error

  apply:
    name: 'Apply - ${{ inputs.environment }}'
    needs: [plan]
    if: |
      always() &&
      (inputs.apply_changes == true) &&
      ((inputs.execution_mode == 'plan-and-apply' && needs.plan.result == 'success') || inputs.execution_mode == 'apply')
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Environment Working Directory
        id: target-dir
        shell: bash
        run: |
          TARGET="${{ inputs.working_directory }}"
          if [ -z "$TARGET" ] || [ ! -d "$TARGET" ]; then
            if [ -d "iac/environments/${{ inputs.environment }}" ]; then
              TARGET="iac/environments/${{ inputs.environment }}"
            elif [ -d "environments/${{ inputs.environment }}" ]; then
              TARGET="environments/${{ inputs.environment }}"
            fi
          fi
          echo "[INFO] Resolved target working directory: $TARGET"
          echo "path=${TARGET}" >> $GITHUB_OUTPUT

      - name: Setup Terraform CLI
        uses: aromapacifico-platform/.github/actions/setup-iac-tools@v1.0.0
        with:
          terraform-version: ${{ inputs.terraform_version }}
          install-tflint: 'false'
          install-trivy: 'false'
          install-infracost: 'false'

      - name: Authenticate to AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.aws_role_arn }}
          aws-region: ${{ inputs.aws_region }}
          audience: sts.amazonaws.com

      - name: Download Immutable Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name != '' && inputs.artifact_name || format('tfplan-{0}', inputs.environment) }}
          path: ${{ steps.target-dir.outputs.path }}

      - name: Verify Plan Integrity and Working Directory
        working-directory: ${{ steps.target-dir.outputs.path }}
        shell: bash
        run: |
          if [ ! -f "tfplan" ]; then
            echo "[INFO] Searching for tfplan in workspace..."
            FOUND=$(find "${{ github.workspace }}" -name "tfplan" -type f | head -n 1)
            if [ -n "$FOUND" ] && [ -f "$FOUND" ]; then
              echo "[INFO] Copying plan artifact from $FOUND to working directory..."
              cp "$FOUND" ./tfplan
            else
              echo "[ERROR] Immutable plan artifact 'tfplan' not found!"
              exit 1
            fi
          fi
          echo "[INFO] Immutable plan artifact verified:"
          ls -la tfplan

      - name: Terraform Init
        working-directory: ${{ steps.target-dir.outputs.path }}
        shell: bash
        run: |
          echo "[INFO] Initializing Terraform backend for apply: ${{ inputs.environment }}"
          terraform init -backend-config=backend.hcl

      - name: Terraform Apply Immutable Plan
        working-directory: ${{ steps.target-dir.outputs.path }}
        shell: bash
        run: |
          echo "[INFO] Manual approval gate successfully passed for environment: ${{ inputs.environment }}."
          echo "[INFO] Immutable binary plan artifact 'tfplan' verified and locked."
          
          # Academic and Zero-Cost Guard:
          # Per AromaPacifico Epic 6 governance (Rule 9 and zero unnecessary cloud costs),
          # live AWS mutation is guarded by the ENABLE_TERRAFORM_APPLY repository variable.
          if [ "${{ vars.ENABLE_TERRAFORM_APPLY || 'false' }}" = "true" ]; then
            echo "[INFO] ENABLE_TERRAFORM_APPLY is enabled. Applying verified immutable plan to environment: ${{ inputs.environment }}..."
            terraform apply -no-color -auto-approve tfplan
          else
            echo "[INFO] Running in Zero-Cost Verification Mode (FNC 2026 Academic Scope: no cloud costs incurred)."
            echo "[INFO] Demonstrating production command: terraform apply -no-color -auto-approve tfplan"
            echo "[INFO] Showing plan summary to verify integrity:"
            terraform show -no-color tfplan | head -n 30 || true
            echo "[SUCCESS] Verified immutable plan for ${{ inputs.environment }} passed manual review and apply verification successfully."
          fi
